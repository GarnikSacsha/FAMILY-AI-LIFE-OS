[build-system]
requires = ["setuptools>=83.0,<84.0", "wheel>=0.44,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-ai-life-os"
version = "1.0.0"
description = "Security-focused family assistant prototype"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.18,<4.0",
    "fastapi>=0.136.3,<1.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0.38,<3.0",
    "greenlet>=3.1,<4.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "google-genai>=1.5,<2.0",
    "google-auth>=2.38,<3.0",
    "aiohttp>=3.14.1,<4.0",
    "redis>=5.2,<9.0",
    "cryptography>=48.0.1,<49.0",
    "pillow>=12.3.0,<13.0",
    "idna>=3.15,<4.0",
    "requests>=2.33.0,<3.0",
    "urllib3>=2.7.0,<3.0",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "aiosqlite>=0.21,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.8,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
