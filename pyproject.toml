[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-ai-life-os"
version = "1.0.0"
description = "Production-ready multi-agent family ecosystem for Denys & Oleksandra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "google-genai>=0.1.1",
    "aiohttp>=3.9.3",
    "redis>=5.0.3",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.8.3",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]
