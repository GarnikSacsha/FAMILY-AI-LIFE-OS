name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ENVIRONMENT: test
  SECRET_KEY: test-secret-key-that-is-long-enough-for-ci-only
  TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  DENYS_TELEGRAM_ID: 100000001
  OLEKSANDRA_TELEGRAM_ID: 100000002
  FAMILY_GROUP_CHAT_ID: -1000000003
  GEMINI_API_KEY: test-gemini-key
  OURA_CLIENT_ID: test-oura-client
  OURA_CLIENT_SECRET: test-oura-secret
  OURA_REDIRECT_URI: http://localhost:8080/oauth/oura/callback
  DATABASE_URL: postgresql+asyncpg://family_os:test-password@localhost:5432/family_life_os_test
  TEST_DATABASE_URL: postgresql+asyncpg://family_os:test-password@localhost:5432/family_life_os_test
  REDIS_URL: redis://:test-password@localhost:6379/0

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: family_os
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: family_life_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U family_os -d family_life_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: python -m pytest --cov=app --cov-branch --cov-report=xml --cov-fail-under=80
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
      - run: bandit -q -r app
      - run: pip-audit
      - run: git diff --exit-code

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build container image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker build --tag family-ai-life-os:ci .; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: family-ai-life-os:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
