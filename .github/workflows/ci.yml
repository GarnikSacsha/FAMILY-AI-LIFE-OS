name: Family AI Life OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff mypy pytest pytest-asyncio coverage

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Test Suite
        run: |
          python -m unittest discover tests/
