name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ENVIRONMENT: test
  SECRET_KEY: test-secret-key-that-is-long-enough-for-ci-only
  TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  DENYS_TELEGRAM_ID: 100000001
  OLEKSANDRA_TELEGRAM_ID: 100000002
  FAMILY_GROUP_CHAT_ID: -1000000003
  GEMINI_API_KEY: test-gemini-key
  OURA_CLIENT_ID: test-oura-client
  OURA_CLIENT_SECRET: test-oura-secret
  OURA_REDIRECT_URI: http://localhost:8080/oauth/oura/callback
  DATABASE_URL: postgresql+asyncpg://family_os:test-password@localhost:5432/family_life_os_test
  REDIS_URL: redis://:test-password@localhost:6379/0

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: family_os
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: family_life_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U family_os -d family_life_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-branch --cov-report=xml --cov-fail-under=80
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
      - run: bandit -q -r app
      - run: pip-audit
      - run: git diff --exit-code

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: family-ai-life-os:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: family-ai-life-os:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
